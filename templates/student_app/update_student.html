{% extends 'student_app/base.html' %}

{% block content %}

<div class="container">

    <h2>Student Updation</h2>
    <h3>Step 1: Basic Details</h3>

    <form method="post">
        {% csrf_token %}

        <label>Student Name</label>
        <input type="text" name="student_name" value="{{ student.student_name }}" required>

        <label>Father's Name</label>
        <input type="text" name="father_name" value="{{ student.father_name }}" required>

        <label>Email</label>
        <input type="email" name="email" value="{{ student.email }}">

        <label>Mobile Number</label>
        <input type="tel" name="mobile_number" maxlength="10" value="{{ student.mobile_number }}" required>

        <label>Date of Birth</label>
        <input type="date" name="dob" value="{{ student.dob|date:'Y-m-d' }}" required>

        <label>Gender</label>
        <select name="gender" required>
            <option value="">Select Gender</option>

            <option value="Male" {% if student.gender == 'Male' %}selected{% endif %}>Male</option>
            <option value="Female" {% if student.gender == 'Female' %}selected{% endif %}>Female</option>
            <option value="Other" {% if student.gender == 'Other' %}selected{% endif %}>Other</option>

        </select>

        <label>Class</label>
        <input type="text" name="class_student" value="{{ student.class_student }}" required>

        <label>Roll Number</label>
        <input type="text" name="roll_number" value="{{ student.roll_number }}" required>

        <button type="submit">Update</button>

    </form>

</div>

{% endblock %}
