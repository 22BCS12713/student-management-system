{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>{% block page_title %}Student Management{% endblock %}</title>
    
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>

<body>

<!-- Sidebar -->
<aside class="sidebar">

    <div class="logo">🎓 Student Management</div>

    <nav>
        <a href="{% url 'dashboard' %}">🏠 Dashboard</a>
        <a href="{% url 'table_url' %}">👨‍🎓 Students</a>
        <a href="{% url 'teachers' %}">👩‍🏫 Teachers</a>
        <a href="{% url 'attendance' %}">📅 Attendance</a>
        <a href="{#}">🏖️ Leave</a>
        <a href="{% url 'notification' %}">📢 Notifications</a>
    </nav>

    <div class="sidebar-bottom">
        <a href="{% url 'logout' %}">🚪 Logout</a>
    </div>

</aside>

<!-- Main Content -->
<main class="main-content">

    <!-- Header -->
    <header class="top-header">
        <h2>{% block title %}{% endblock %}</h2>
        <div class="user-info">
            👤 {{ request.user.username }}
        </div>
    </header>

    <!-- Page Content -->
    <div class="content">
        {% block content %}
        {% endblock %}
    </div>

</main>

</body>
</html>
