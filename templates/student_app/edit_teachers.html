{% extends 'student_app/base.html' %}

{% block content %}

<div class="form-container">
    <h2>Add Teacher</h2>

    <form method="POST">
    {% csrf_token %}

    <div class="form-group">
        <label>Teacher Name</label>
        <input type="text" name="name" value="{{ t.name }}" required>
    </div>

    <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" value="{{ t.email }}" required>
    </div>

    <div class="form-group">
        <label>Mobile Number</label>
        <input type="text" name="mobile_number" value="{{ t.mobile_number }}" required>
    </div>

    <div class="form-group">
        <label>Subject</label>
        <input type="text" name="subjects" value="{{ t.subjects }}" required>
    </div>

    <div class="form-group">
        <label>Assigned Class</label>
        <input type="text" name="Assigned_class" value="{{ t.Assigned_class }}" required>
    </div>

    <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter new Password" required>
    </div>

    <button type="submit">Save Changes</button>
</form>
{% endblock %}
